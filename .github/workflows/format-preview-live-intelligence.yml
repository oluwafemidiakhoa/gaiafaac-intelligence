name: Format Preview Live Intelligence

on:
  push:
    branches:
      - feat/live-decision-packet-intelligence

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show exact Prettier output
        run: |
          npx prettier --write apps/web/src/components/decision-packet-intelligence.tsx apps/web/src/components/decision-packet-intelligence.test.tsx
          git diff -- apps/web/src/components/decision-packet-intelligence.tsx apps/web/src/components/decision-packet-intelligence.test.tsx
