name: Fix national derivation parser branch

on:
  push:
    branches:
      - feat/national-evidence-autopilot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-evidence-autopilot
      - name: Bind derivation amount to its sentence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/gaiafaac_api/pipeline/national_evidence.py')
          text = path.read_text()
          old = '''    derivation_match = None\n    for match in re.finditer(MONEY_PATTERN, text, flags=re.I):\n        context = text[max(0, match.start() - 120) : match.end() + 120].casefold()\n        if "derivation" in context:\n            derivation_match = match\n            break\n    if derivation_match is None:\n        raise NationalEvidenceError("Required 13% derivation claim is missing")\n'''
          new = '''    derivation_match = None\n    for sentence in re.split(r"(?<=[.!?])\\s+", text):\n        if "derivation" not in sentence.casefold():\n            continue\n        money_matches = list(re.finditer(MONEY_PATTERN, sentence, flags=re.I))\n        if not money_matches:\n            continue\n        derivation_at = sentence.casefold().find("derivation")\n        derivation_match = min(\n            money_matches,\n            key=lambda match: abs(match.start() - derivation_at),\n        )\n        break\n    if derivation_match is None:\n        raise NationalEvidenceError("Required 13% derivation claim is missing")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected derivation block once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit derivation parser fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/pipeline/national_evidence.py
          git commit -m "Bind derivation extraction to source sentence"
          git push origin HEAD:feat/national-evidence-autopilot
