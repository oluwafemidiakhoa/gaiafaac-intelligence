name: Monitor historical OAGF revisions

# Weekly full-history integrity pass. It rechecks the official FAAC inventory,
# retains exact changed bytes, and creates human review cases. It never alters
# published allocations and never approves or publishes evidence.
on:
  schedule:
    - cron: '45 6 * * 0' # Sunday 06:45 UTC
  workflow_dispatch: {}

concurrency:
  group: monitor-oagf-history
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API package
        run: python -m pip install -e "apps/api[extraction]"
      - name: Scan full official OAGF FAAC history for source revisions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ENVIRONMENT: production
        run: python -m gaiafaac_api.pipeline.oagf.revision_monitor --full-history
