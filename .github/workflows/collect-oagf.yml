name: Collect OAGF FAAC data

# Daily, governance-preserving OAGF intake. The first pass queues newly published
# jurisdiction months; the second pass rechecks official FAAC source bytes for
# revisions. Neither pass approves, mutates published fiscal data, or publishes.
on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: collect-oagf
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the API package (with PDF/Excel extraction extras)
        run: python -m pip install -e "apps/api[extraction]"
      - name: Collect new OAGF jurisdiction months (never publishes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ENVIRONMENT: production
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: gaiafaac-db collect-oagf --months-back 24
      - name: Detect and retain recent official OAGF revisions (never publishes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ENVIRONMENT: production
        run: python -m gaiafaac_api.pipeline.oagf.revision_monitor --months-back 24
