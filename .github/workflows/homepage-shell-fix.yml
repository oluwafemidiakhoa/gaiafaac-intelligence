name: Homepage shell repair (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove duplicate homepage shell
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("apps/web/src/app/page.tsx")
          source = page.read_text()

          header_start = "      {/* Header */}\n"
          hero_start = "      {/* Hero / Thesis */}\n"
          if header_start not in source or hero_start not in source:
              raise SystemExit("Expected homepage header/hero markers not found")
          before, remainder = source.split(header_start, 1)
          _, after_header = remainder.split(hero_start, 1)
          source = before + hero_start + after_header

          footer_start = "      {/* Footer */}\n"
          footer_end = "      </footer>\n"
          if footer_start not in source or footer_end not in source:
              raise SystemExit("Expected homepage footer markers not found")
          before_footer, remainder = source.split(footer_start, 1)
          _, after_footer = remainder.split(footer_end, 1)
          source = before_footer + after_footer

          old_cta = '''            <button className="bg-gold-600 rounded px-8 py-3 font-semibold text-teal-900 hover:bg-yellow-100">\n              Request Access\n            </button>\n'''
          new_cta = '''            <Link\n              href="/pricing"\n              className="bg-gold-600 rounded px-8 py-3 font-semibold text-teal-900 hover:bg-yellow-100"\n            >\n              Request Access\n            </Link>\n'''
          if old_cta not in source:
              raise SystemExit("Expected Request Access CTA button not found")
          source = source.replace(old_cta, new_cta, 1)
          page.write_text(source)

          test = Path("apps/web/src/app/page.test.tsx")
          test_source = test.read_text()
          stale_assertions = '''    expect(\n      screen.getAllByRole('link', { name: /Terminal/i })[0],\n    ).toHaveAttribute('href', '/terminal')\n    expect(\n      screen.getAllByRole('link', { name: /Institutions/i })[0],\n    ).toHaveAttribute('href', '/institutions')\n'''
          replacement = "    expect(screen.queryByRole('navigation')).not.toBeInTheDocument()\n"
          if stale_assertions not in test_source:
              raise SystemExit("Expected homepage-local navigation assertions not found")
          test.write_text(test_source.replace(stale_assertions, replacement, 1))
          PY

      - name: Format
        run: npx prettier --write apps/web/src/app/page.tsx apps/web/src/app/page.test.tsx

      - name: Verify web
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/page.tsx apps/web/src/app/page.test.tsx
          if git diff --cached --quiet; then
            echo "No homepage shell changes to commit"
          else
            git commit -m "fix(web): remove duplicate homepage navigation and footer"
            git push origin HEAD:main
          fi
