name: Revenue Engine v1 formatter (temporary)

on:
  push:
    branches: [feat/revenue-engine-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/revenue-engine-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: python -m pip install "ruff==0.16.6"
      - run: npm ci

      - name: Apply canonical source formatting
        run: |
          python -m ruff format apps/api/src/gaiafaac_api/api/v1/routes/billing.py apps/api/tests/test_paystack_billing.py
          npx prettier --write apps/web/src/app/account/billing/page.tsx apps/web/src/components/site-header.tsx

      - name: Verify formatting
        run: |
          python -m ruff format --check apps/api/src/gaiafaac_api/api/v1/routes/billing.py apps/api/tests/test_paystack_billing.py
          npx prettier --check apps/web/src/app/account/billing/page.tsx apps/web/src/components/site-header.tsx

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/api/v1/routes/billing.py apps/api/tests/test_paystack_billing.py apps/web/src/app/account/billing/page.tsx apps/web/src/components/site-header.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "chore: format Revenue Engine v1 sources"
            git push origin HEAD:feat/revenue-engine-v1
          fi
