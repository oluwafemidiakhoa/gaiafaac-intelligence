name: Format diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npm run format:write
          git diff -- apps/web/src/app/review/pending apps/web/src/components/site-header.tsx apps/web/src/lib/review-api.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show Ruff format diff
        run: |
          python -m pip install ruff
          python -m ruff format apps/api
          git diff -- apps/api/src/gaiafaac_api/services/review_queue.py
