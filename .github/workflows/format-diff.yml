name: Format accountant review branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m ruff format apps/api
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web
          git commit -m "Apply repository formatters"
          git push origin HEAD:${{ github.head_ref }}
