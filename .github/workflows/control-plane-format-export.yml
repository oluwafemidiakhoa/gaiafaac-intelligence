name: Control Plane canonical formatter

on:
  push:
    branches: [feat/gaia-control-plane-v2]

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gaia-control-plane-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            'apps/web/src/app/verify/[receiptId]/page.tsx' \
            apps/web/src/components/evidence-rooms-workspace.tsx \
            apps/web/src/lib/fiscal-receipt-api.ts \
            docs/COMMERCIAL_PRODUCT_AUDIT.md \
            e2e/control-plane.spec.mjs
      - name: Verify repository formatting
        run: npm run format
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/web/src/app/verify/[receiptId]/page.tsx' \
            apps/web/src/components/evidence-rooms-workspace.tsx \
            apps/web/src/lib/fiscal-receipt-api.ts \
            docs/COMMERCIAL_PRODUCT_AUDIT.md \
            e2e/control-plane.spec.mjs
          git commit -m 'style(web): finish canonical Control Plane formatting'
          git push origin HEAD:feat/gaia-control-plane-v2
