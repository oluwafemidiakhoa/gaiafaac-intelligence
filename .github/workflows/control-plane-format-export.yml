name: Control Plane format export

on:
  push:
    branches: [feat/gaia-control-plane-v2]

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format current CI blockers
        run: |
          npx prettier --write \
            'apps/web/src/app/jurisdictions/[code]/local-governments/page.tsx' \
            'apps/web/src/app/verify/[receiptId]/page.tsx' \
            apps/web/src/components/evidence-rooms-workspace.tsx \
            apps/web/src/lib/fiscal-receipt-api.ts \
            docs/COMMERCIAL_PRODUCT_AUDIT.md \
            e2e/control-plane.spec.mjs
      - name: Verify repository formatting
        run: npm run format
      - name: Bundle canonical files
        run: |
          mkdir -p /tmp/control-plane-format
          cp --parents \
            'apps/web/src/app/jurisdictions/[code]/local-governments/page.tsx' \
            'apps/web/src/app/verify/[receiptId]/page.tsx' \
            apps/web/src/components/evidence-rooms-workspace.tsx \
            apps/web/src/lib/fiscal-receipt-api.ts \
            docs/COMMERCIAL_PRODUCT_AUDIT.md \
            e2e/control-plane.spec.mjs \
            /tmp/control-plane-format/
      - uses: actions/upload-artifact@v4
        with:
          name: control-plane-canonical-format
          path: /tmp/control-plane-format
          if-no-files-found: error
          retention-days: 1
