name: Watch Contract format export

on:
  push:
    branches: [feat/fiscal-watch-contracts]

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API tooling
        run: python -m pip install -e "apps/api[dev,extraction]"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web tooling
        run: npm ci
      - name: Apply canonical formatters
        run: |
          python -m ruff format apps/api/src/gaiafaac_api/services/watch_contracts.py
          npx prettier --write apps/web/src/components/fiscal-watch-contracts-workspace.tsx
      - name: Verify formatting
        run: |
          python -m ruff format --check apps/api
          npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: watch-contract-canonical-format
          path: |
            apps/api/src/gaiafaac_api/services/watch_contracts.py
            apps/web/src/components/fiscal-watch-contracts-workspace.tsx
          if-no-files-found: error
          retention-days: 1
