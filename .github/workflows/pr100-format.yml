name: PR100 formatter (temporary)

on:
  push:
    branches: [fix/production-paystack-monetization]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-paystack-monetization

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - run: npm ci
      - run: python -m pip install -e "apps/api[dev,extraction]"

      - name: Apply canonical formatters
        run: |
          python -m ruff format apps/api
          npx prettier --write apps/web/src/app/pricing/page.tsx

      - name: Verify formatter gates
        run: |
          python -m ruff format --check apps/api
          npx prettier --check apps/web/src/app/pricing/page.tsx

      - name: Commit formatted source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/api/v1/routes/billing.py apps/web/src/app/pricing/page.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "chore: format monetization changes"
            git push origin HEAD:fix/production-paystack-monetization
          fi
