name: Patch Commercial Home

on:
  push:
    branches: [feat/commercial-revenue-completion-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-revenue-completion-v1

      - name: Patch commercial homepage story
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/page.tsx')
          text = path.read_text()

          anchor = "import { getPublishedAnalytics } from '@/lib/analytics-api'\n"
          replacement = "import {\n  CommercialDecisionChain,\n  ExpensiveDecisionWorkflows,\n} from '@/components/commercial-home-sections'\n" + anchor
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          old = '''            <h1 className="max-w-[14ch] text-[clamp(3.35rem,7.2vw,7.2rem)] leading-[0.92] font-semibold tracking-[-0.065em] text-balance">\n              The intelligence layer for Nigeria&apos;s public money.\n            </h1>\n\n            <p className="mt-8 max-w-2xl text-lg leading-8 text-teal-50/75 sm:text-xl">\n              Gaia turns official fiscal records into governed, machine-readable\n              evidence that institutions can audit, query, compare, and act\n              on—with the source trail still attached.\n            </p>\n'''
          new = '''            <h1 className="max-w-[16ch] text-[clamp(3rem,6vw,6.2rem)] leading-[0.94] font-semibold tracking-[-0.06em] text-balance">\n              Know what changed. Know what evidence supports it. Preserve what your institution knew when it made the decision.\n            </h1>\n\n            <p className="mt-8 max-w-2xl text-lg leading-8 text-teal-50/75 sm:text-xl">\n              Gaia turns fragmented Nigerian public-finance records into governed\n              evidence, monitoring and decision records for institutions allocating\n              capital.\n            </p>\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''              <Link\n                href="/terminal"\n                className="group inline-flex items-center gap-2 rounded-full bg-amber-300 px-6 py-3.5 text-sm font-bold text-teal-950 shadow-[0_12px_50px_rgba(252,211,77,.2)] transition hover:-translate-y-0.5 hover:bg-amber-200"\n              >\n                Open live terminal\n                <ArrowRight className="size-4 transition-transform group-hover:translate-x-0.5" />\n              </Link>\n              <Link\n                href="/pilot"\n                className="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 px-6 py-3.5 text-sm font-semibold text-white backdrop-blur transition hover:-translate-y-0.5 hover:bg-white/10"\n              >\n                Request institutional pilot\n              </Link>\n'''
          new = '''              <Link\n                href="/terminal"\n                className="group inline-flex items-center gap-2 rounded-full bg-amber-300 px-6 py-3.5 text-sm font-bold text-teal-950 shadow-[0_12px_50px_rgba(252,211,77,.2)] transition hover:-translate-y-0.5 hover:bg-amber-200"\n              >\n                Open Fiscal Terminal\n                <ArrowRight className="size-4 transition-transform group-hover:translate-x-0.5" />\n              </Link>\n              <Link\n                href="/decision-rooms"\n                className="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/5 px-6 py-3.5 text-sm font-semibold text-white backdrop-blur transition hover:-translate-y-0.5 hover:bg-white/10"\n              >\n                Start a Decision Room\n              </Link>\n              <Link\n                href="/pilot"\n                className="inline-flex items-center gap-2 rounded-full border border-emerald-300/25 bg-emerald-300/10 px-6 py-3.5 text-sm font-semibold text-emerald-50 transition hover:-translate-y-0.5 hover:bg-emerald-300/15"\n              >\n                Request Institutional Access\n              </Link>\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''      </section>\n\n      {!data && (\n'''
          insert = '''      </section>\n\n      <CommercialDecisionChain />\n      <ExpensiveDecisionWorkflows />\n\n      {!data && (\n'''
          assert marker in text
          text = text.replace(marker, insert, 1)

          path.write_text(text)
          PY

          rm .github/workflows/patch-commercial-home.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prettier --write apps/web/src/app/page.tsx apps/web/src/components/commercial-home-sections.tsx

      - name: Commit homepage overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/page.tsx apps/web/src/components/commercial-home-sections.tsx .github/workflows/patch-commercial-home.yml
          git commit -m "feat(web): make homepage lead with institutional decision value"
          git push origin HEAD:feat/commercial-revenue-completion-v1
