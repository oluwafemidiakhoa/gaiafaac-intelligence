name: Format Canonical IGR PR

on:
  push:
    branches:
      - fix/canonical-igr-publication

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-igr-publication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e "apps/api[dev,extraction]"
      - run: python -m ruff format apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web packages package.json package-lock.json .github/workflows/format-canonical-igr.yml
          git commit -m "chore: apply repository formatters [format-bot]"
          git push
