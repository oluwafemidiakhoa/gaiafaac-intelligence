name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture exact Prettier output for Fiscal Design manifest verifier
        run: |
          npx prettier --write apps/web/src/app/fiscal-design/verify/manifest-verifier.tsx apps/web/src/lib/fiscal-design-manifest-verifier.ts
          git diff -- apps/web/src/app/fiscal-design/verify/manifest-verifier.tsx apps/web/src/lib/fiscal-design-manifest-verifier.ts
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev,extraction]"
      - run: python -m ruff format --check apps/api
      - run: python -m ruff check apps/api
      - run: python -m pytest apps/api/tests
