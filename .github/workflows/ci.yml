name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Inspect remaining Prettier diff
        run: |
          npx prettier --write apps/web/src/app/sources/page.tsx apps/web/src/lib/published-api.ts
          git diff -- apps/web/src/app/sources/page.tsx apps/web/src/lib/published-api.ts
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev,extraction]"
      - run: python -m ruff format --check apps/api
      - run: python -m ruff check apps/api
      - run: python -m pytest apps/api/tests
