name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e "apps/api[dev,extraction]"
      - name: Normalize formatting
        run: |
          python -m ruff format apps/api
          npx prettier --write apps/web/src/app/review apps/web/src/lib/oagf-revision-api.ts
      - name: Commit deterministic formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web/src/app/review apps/web/src/lib/oagf-revision-api.ts
          git commit -m "Normalize OAGF revision formatting"
          git push origin HEAD:${{ github.head_ref }}
