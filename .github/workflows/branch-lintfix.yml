name: One-shot national lint fix

on:
  push:
    branches:
      - feat/national-faac-reconciliation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-faac-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix long source strings
        shell: python
        run: |
          from pathlib import Path

          pipeline = Path('apps/api/src/gaiafaac_api/pipeline/national_distribution.py')
          text = pipeline.read_text()
          replacements = {
              '            else "The observed national components do not reconcile within source-derived reporting precision."': '            else (\n                "The observed national components do not reconcile within "\n                "source-derived reporting precision."\n            )',
              '                "Declare whether the official states aggregate covers 36 states or 36 states plus FCT.",': '                (\n                    "Declare whether the official states aggregate covers 36 states "\n                    "or 36 states plus FCT."\n                ),',
              '                    "National gross amount minus deductions does not reconcile with the distributable total.",': '                    (\n                        "National gross amount minus deductions does not reconcile "\n                        "with the distributable total."\n                    ),',
              '                "Use a distinct national source document; a jurisdiction-allocation source cannot be reused."': '                (\n                    "Use a distinct national source document; a jurisdiction-allocation "\n                    "source cannot be reused."\n                )',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected pipeline text: {old}')
              text = text.replace(old, new)
          pipeline.write_text(text)

          service = Path('apps/api/src/gaiafaac_api/services/national_distribution.py')
          text = service.read_text()
          old = '                else "The official states aggregate conflicts with the published jurisdiction ledger."'
          new = '                else (\n                    "The official states aggregate conflicts with the published "\n                    "jurisdiction ledger."\n                )'
          if old not in text:
              raise SystemExit('missing expected service text')
          service.write_text(text.replace(old, new))
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m ruff format apps/api
      - run: python -m ruff check apps/api
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/branch-lintfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix national reconciliation lint"
          git push origin HEAD:feat/national-faac-reconciliation
