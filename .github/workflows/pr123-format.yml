name: PR 123 formatter

on:
  push:
    branches:
      - feat/project-downloads-and-cta

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-downloads-and-cta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install ruff==0.16.6
      - run: npm ci
      - name: Apply exact repository formatters
        run: |
          python -m ruff format apps/api/src/gaiafaac_api/services/one_time_exports.py
          npx prettier --write apps/web/src/app/account/page.tsx apps/web/src/app/projects/page.tsx
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/services/one_time_exports.py apps/web/src/app/account/page.tsx apps/web/src/app/projects/page.tsx
          git commit -m "style: format project product delivery files"
          git push origin HEAD:feat/project-downloads-and-cta
