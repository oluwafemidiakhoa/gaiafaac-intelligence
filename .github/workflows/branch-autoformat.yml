name: One-shot branch formatter

on:
  push:
    branches:
      - feat/national-faac-reconciliation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-faac-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -e "apps/api[dev,extraction]"
      - run: python -m ruff format apps/api
      - run: npm ci
      - run: npm run format:write
      - name: Commit formatted files and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/branch-autoformat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format national reconciliation changes"
          git push origin HEAD:feat/national-faac-reconciliation
