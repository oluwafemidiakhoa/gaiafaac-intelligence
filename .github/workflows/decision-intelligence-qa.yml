name: Decision Intelligence QA

on:
  pull_request:
    paths:
      - 'apps/api/src/gaiafaac_api/services/*one_time_exports.py'
      - 'apps/api/tests/test_institutional_one_time_exports.py'
      - 'apps/web/src/components/decision-packet-intelligence*'
      - 'scripts/render_decision_pack_qa.py'
      - '.github/workflows/decision-intelligence-qa.yml'

permissions:
  contents: read

jobs:
  document-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e 'apps/api[dev,extraction]'
      - name: Verify chart values and missing-versus-zero handling
        run: python -m pytest apps/api/tests/test_institutional_one_time_exports.py
      - name: Generate pre-release previews from public evidence
        run: python scripts/render_decision_pack_qa.py
      - name: Upload document QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-intelligence-qa
          path: qa-out/
          retention-days: 7
