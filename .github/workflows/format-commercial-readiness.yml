name: Format commercial readiness branch

on:
  workflow_dispatch:
  push:
    branches:
      - feat/commercial-readiness-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-readiness-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.6'
      - run: |
          python -m ruff format \
            apps/api/src/gaiafaac_api/api/v1/routes/one_time_billing.py \
            apps/api/src/gaiafaac_api/services/one_time_fulfillment.py \
            apps/api/src/gaiafaac_api/services/canonical_igr.py \
            apps/api/tests/test_customer_self_service.py \
            apps/api/tests/test_canonical_igr_successor_eligibility.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            apps/web/src/app/projects/page.tsx \
            apps/web/src/app/sources/page.tsx \
            apps/web/src/lib/evidence-network-api.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/gaiafaac_api/api/v1/routes/one_time_billing.py \
            apps/api/src/gaiafaac_api/services/one_time_fulfillment.py \
            apps/api/src/gaiafaac_api/services/canonical_igr.py \
            apps/api/tests/test_customer_self_service.py \
            apps/api/tests/test_canonical_igr_successor_eligibility.py \
            apps/web/src/app/projects/page.tsx \
            apps/web/src/app/sources/page.tsx \
            apps/web/src/lib/evidence-network-api.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format commercial readiness changes'
            git push origin HEAD:feat/commercial-readiness-hardening
          fi
