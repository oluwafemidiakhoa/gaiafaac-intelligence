name: Format national autopilot branch

on:
  push:
    branches:
      - feat/national-evidence-autopilot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-evidence-autopilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install ruff==0.16.3
      - run: npm ci
      - run: python -m ruff format apps/api
      - run: npx prettier --write apps/web/src/lib/national-review-api.ts apps/web/src/app/review/national/page.tsx 'apps/web/src/app/review/national/[runId]/page.tsx'
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web/src/lib/national-review-api.ts apps/web/src/app/review/national
          git commit -m "Format national evidence automation"
          git push origin HEAD:feat/national-evidence-autopilot
