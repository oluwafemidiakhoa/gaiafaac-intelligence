name: Format Pricing PR39

on:
  push:
    branches:
      - feat/research-command-center

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-command-center
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write apps/web/src/app/pricing/page.tsx
      - name: Commit formatted file and remove temporary workflow
        run: |
          rm .github/workflows/format-pricing-pr39.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/pricing/page.tsx .github/workflows/format-pricing-pr39.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Prettier to pricing page"
          git push origin HEAD:feat/research-command-center
