name: Pricing Formatter Temporary

on:
  push:
    branches: [feat/commercial-pricing-clarity]

permissions:
  contents: write

jobs:
  format-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-pricing-clarity
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format pricing page
        run: npx prettier --write apps/web/src/app/pricing/page.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- apps/web/src/app/pricing/page.tsx; then
            echo "Pricing page already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/pricing/page.tsx
          git commit -m "style: format pricing page"
          git push origin HEAD:feat/commercial-pricing-clarity
