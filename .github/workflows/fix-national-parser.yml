name: Fix national parser branch

on:
  push:
    branches:
      - feat/national-evidence-autopilot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-evidence-autopilot
      - name: Exclude page head from evidence claim text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/gaiafaac_api/pipeline/national_evidence.py')
          text = path.read_text()
          old = 'if tag in {"script", "style", "noscript", "svg"}'
          new = 'if tag in {"head", "script", "style", "noscript", "svg"}'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 parser guard occurrences, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit parser fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/pipeline/national_evidence.py
          git commit -m "Exclude page titles from national claim extraction"
          git push origin HEAD:feat/national-evidence-autopilot
