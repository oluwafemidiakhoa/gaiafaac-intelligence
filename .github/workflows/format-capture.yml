name: Format Capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format changed review UX files
        run: |
          npx prettier --write \
            apps/web/src/components/decision-review-queue.tsx \
            apps/web/src/components/decision-review-workspace.tsx \
            e2e/control-plane.spec.mjs
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: decision-review-prettier-output
          path: |
            apps/web/src/components/decision-review-queue.tsx
            apps/web/src/components/decision-review-workspace.tsx
            e2e/control-plane.spec.mjs
          if-no-files-found: error
