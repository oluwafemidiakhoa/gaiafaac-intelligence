name: Format Commercial PR

on:
  push:
    branches: [feat/commercial-revenue-completion-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-revenue-completion-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply repository Prettier configuration
        run: >-
          npx prettier --write
          apps/web/src/app/admin/leads/page.tsx
          apps/web/src/components/pilot-lead-form.tsx
          apps/web/src/lib/commercial-api.ts
          e2e/control-plane.spec.mjs
          README.md

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/admin/leads/page.tsx apps/web/src/components/pilot-lead-form.tsx apps/web/src/lib/commercial-api.ts e2e/control-plane.spec.mjs README.md
          git commit -m "style(web): apply Prettier to commercial branch"
          git push origin HEAD:feat/commercial-revenue-completion-v1
