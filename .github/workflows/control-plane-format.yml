name: Control Plane formatter (temporary)

on:
  push:
    branches: [feat/gaia-control-plane-v2]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gaia-control-plane-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Control Plane files
        run: |
          npx prettier --write \
            apps/web/src/app/account/billing/page.tsx \
            apps/web/src/app/fiscal-pulse/page.tsx \
            apps/web/src/app/globals.css \
            apps/web/src/app/institutional/page.tsx \
            apps/web/src/app/pricing/page.tsx \
            apps/web/src/app/review/page.tsx \
            apps/web/src/app/terminal/page.tsx \
            apps/web/src/components/fiscal-command-canvas.tsx \
            apps/web/src/components/metric-card.tsx \
            apps/web/src/components/page-header.tsx \
            apps/web/src/components/site-footer.tsx \
            apps/web/src/components/ui/card.tsx

      - name: Verify formatting
        run: npm run format

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/account/billing/page.tsx \
            apps/web/src/app/fiscal-pulse/page.tsx \
            apps/web/src/app/globals.css \
            apps/web/src/app/institutional/page.tsx \
            apps/web/src/app/pricing/page.tsx \
            apps/web/src/app/review/page.tsx \
            apps/web/src/app/terminal/page.tsx \
            apps/web/src/components/fiscal-command-canvas.tsx \
            apps/web/src/components/metric-card.tsx \
            apps/web/src/components/page-header.tsx \
            apps/web/src/components/site-footer.tsx \
            apps/web/src/components/ui/card.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style(web): format Control Plane v2"
            git push origin HEAD:feat/gaia-control-plane-v2
          fi
