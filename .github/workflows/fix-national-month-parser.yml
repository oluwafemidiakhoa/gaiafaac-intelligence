name: Fix national month parser branch

on:
  push:
    branches:
      - feat/national-evidence-autopilot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/national-evidence-autopilot
      - name: Support official 'as MONTH YEAR federation revenue' phrasing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/gaiafaac_api/pipeline/national_evidence.py')
          text = path.read_text()
          needle = '''    if not allocation_matches:\n        allocation_matches = re.findall(\n            rf"for\\s+the\\s+month\\s+of\\s+({MONTH_PATTERN})[,]?\\s+(20\\d{{2}})",\n            text,\n            flags=re.I,\n        )\n'''
          replacement = '''    if not allocation_matches:\n        allocation_matches = re.findall(\n            rf"for\\s+the\\s+month\\s+of\\s+({MONTH_PATTERN})[,]?\\s+(20\\d{{2}})",\n            text,\n            flags=re.I,\n        )\n    if not allocation_matches:\n        allocation_matches = re.findall(\n            rf"\\bas\\s+({MONTH_PATTERN})[,]?\\s+(20\\d{{2}})\\s+"\n            rf"(?:federation\\s+)?revenue",\n            text,\n            flags=re.I,\n        )\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected month fallback once, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement))
          PY
      - name: Commit month parser fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/gaiafaac_api/pipeline/national_evidence.py
          git commit -m "Support official federation revenue month phrasing"
          git push origin HEAD:feat/national-evidence-autopilot
