name: Collect national FAAC evidence

# Daily, governance-preserving collector. It discovers official government
# releases, archives their exact bytes, imports deterministic claims into review,
# and NEVER approves or publishes evidence.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: collect-national-faac
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API package
        run: python -m pip install -e "apps/api[extraction]"
      - name: Discover, archive, validate, and queue national evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ENVIRONMENT: production
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set -o pipefail
          gaiafaac-national collect --months-back 24 | tee national-collection.log
      - name: Report national collection outcomes
        if: always()
        run: |
          if [ ! -f national-collection.log ]; then
            echo "National collection did not produce an outcome log." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::National collection did not produce an outcome log; inspect the collector failure."
            exit 0
          fi
          summary=$(grep 'National collection complete:' national-collection.log | tail -n 1 || true)
          if [ -z "$summary" ]; then
            echo "National collector outcome summary was not emitted." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::National collection completed without a parseable outcome summary."
            exit 0
          fi
          echo "### National source collection outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          quarantined=$(printf '%s' "$summary" | sed -n 's/.*quarantined=\\([0-9][0-9]*\\).*/\\1/p')
          if [ -n "$quarantined" ] && [ "$quarantined" -gt 0 ]; then
            echo "::warning::National collector quarantined $quarantined source candidates. Workflow success does not imply complete evidence coverage; review quarantine reasons."
          fi
