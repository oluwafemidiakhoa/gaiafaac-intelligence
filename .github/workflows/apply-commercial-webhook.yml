name: Apply one-time webhook completion

on:
  push:
    branches:
      - feat/commercial-readiness-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-readiness-hardening
      - name: Route signed Paystack one-time events
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/gaiafaac_api/api/v1/routes/billing.py')
          text = path.read_text()
          old = '''    if event.get("event") == "charge.success":
              data = event.get("data") or {}
              subscription = _activate_paystack_subscription(session, data)
              if subscription is not None:
                  payment = _record_paystack_payment(session, data, subscription)
                  if payment is not None:
                      customer = data.get("customer") or {}
                      customer_email = customer.get("email") if isinstance(customer, dict) else None
                      deliver_payment_onboarding(
                          session,
                          payment=payment,
                          subscription=subscription,
                          email=customer_email,
                      )
                      record_commercial_event_once(
                          session,
                          event_name="checkout_completed",
                          organization_id=subscription.organization_id,
                          subject_type="payment_record",
                          subject_id=str(payment.id),
                          metadata={"plan_code": subscription.plan_code, "provider": "paystack"},
                      )
                      record_commercial_event_once(
                          session,
                          event_name="entitlement_activated",
                          organization_id=subscription.organization_id,
                          subject_type="payment_record",
                          subject_id=str(payment.id),
                          metadata={"plan_code": subscription.plan_code},
                      )
          '''
          new = '''    if event.get("event") == "charge.success":
              data = event.get("data") or {}
              from gaiafaac_api.api.v1.routes.one_time_billing import (
                  process_one_time_paystack_success,
              )

              one_time_purchase = process_one_time_paystack_success(session, data)
              if one_time_purchase is None:
                  subscription = _activate_paystack_subscription(session, data)
                  if subscription is not None:
                      payment = _record_paystack_payment(session, data, subscription)
                      if payment is not None:
                          customer = data.get("customer") or {}
                          customer_email = customer.get("email") if isinstance(customer, dict) else None
                          deliver_payment_onboarding(
                              session,
                              payment=payment,
                              subscription=subscription,
                              email=customer_email,
                          )
                          record_commercial_event_once(
                              session,
                              event_name="checkout_completed",
                              organization_id=subscription.organization_id,
                              subject_type="payment_record",
                              subject_id=str(payment.id),
                              metadata={"plan_code": subscription.plan_code, "provider": "paystack"},
                          )
                          record_commercial_event_once(
                              session,
                              event_name="entitlement_activated",
                              organization_id=subscription.organization_id,
                              subject_type="payment_record",
                              subject_id=str(payment.id),
                              metadata={"plan_code": subscription.plan_code},
                          )
          '''
          if old not in text:
              raise SystemExit('Expected Paystack webhook block not found; refusing to edit.')
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.6'
      - run: python -m ruff format apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/app/projects/page.tsx apps/web/src/app/sources/page.tsx apps/web/src/lib/evidence-network-api.ts
      - name: Commit exact edits and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api apps/web/src/app/projects/page.tsx apps/web/src/app/sources/page.tsx apps/web/src/lib/evidence-network-api.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: complete one-time payments from Paystack webhook'
            git push origin HEAD:feat/commercial-readiness-hardening
          fi
