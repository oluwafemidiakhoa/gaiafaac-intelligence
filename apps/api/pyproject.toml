[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gaiafaac-api"
version = "0.1.0"
description = "GaiaFAAC Intelligence public API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2",
  "boto3>=1.34,<2",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "stripe>=14.4,<15",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
gaiafaac-db = "gaiafaac_api.cli:main"
gaiafaac-dmo = "gaiafaac_api.dmo_cli:main"
gaiafaac-nbs-igr = "gaiafaac_api.nbs_igr_cli:main"
gaiafaac-state-budget = "gaiafaac_api.state_budget_cli:main"
gaiafaac-state-financials = "gaiafaac_api.state_financials_cli:main"
gaiafaac-national = "gaiafaac_api.national_cli:main"
gaiafaac-lga = "gaiafaac_api.lga_cli:main"
gaiafaac-webhooks = "gaiafaac_api.institutional_webhook_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
extraction = [
  "pdfplumber>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gaiafaac_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"src/gaiafaac_api/api/routes/subscriptions.py" = ["B904"]
"src/gaiafaac_api/api/v1/routes/evidence_provenance.py" = ["B904"]
"src/gaiafaac_api/api/v1/routes/institutional_decisions.py" = ["B904"]
"src/gaiafaac_api/database/subscription_models.py" = ["UP042"]
"src/gaiafaac_api/services/decision_support.py" = ["UP042"]
"src/gaiafaac_api/services/evidence_audit.py" = ["SIM102", "UP042"]

[tool.ruff.format]
exclude = ["src/gaiafaac_api/pipeline/national_evidence_hardened.py"]
